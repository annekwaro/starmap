<div class="toolbar">
  <button type="button" class="pill" #backButton (click)="back.emit()">
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
      <path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    Back
  </button>
  <button type="button" class="pill" [disabled]="exportState() === 'busy'" (click)="exportPng()">
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
      <path d="M8 2v8M4.5 6.5L8 10l3.5-3.5M3 13h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    @switch (exportState()) {
      @case ('busy') { Exporting… }
      @case ('error') { Export failed — retry }
      @default { Export as PNG }
    }
  </button>
</div>

<!--
  Colours inside the SVG are presentation attributes, not CSS: html2canvas serialises
  the SVG into an image, which drops stylesheet rules. CSS here only adds animation.
-->
<figure class="poster" #poster>
  <svg class="map" viewBox="-40 -40 680 680" role="img" [attr.aria-label]="caption().text + ' ' + moon().name + '.'">
    <defs>
      <radialGradient id="dome" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#111a2e" />
        <stop offset="70%" stop-color="#080c16" />
        <stop offset="100%" stop-color="#04060b" />
      </radialGradient>
      <radialGradient id="halo">
        <stop offset="0%" stop-color="#fff" stop-opacity="0.55" />
        <stop offset="100%" stop-color="#fff" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="moon-lit" cx="40%" cy="35%" r="75%">
        <stop offset="0%" stop-color="#fbf7ec" />
        <stop offset="100%" stop-color="#d8cfb8" />
      </radialGradient>
      <radialGradient id="moon-glow">
        <stop offset="40%" stop-color="#f3ecd8" stop-opacity="0.18" />
        <stop offset="100%" stop-color="#f3ecd8" stop-opacity="0" />
      </radialGradient>
    </defs>

    <circle [attr.cx]="center" [attr.cy]="center" [attr.r]="radius" fill="url(#dome)" />
    @for (r of rings; track r) {
      <circle [attr.cx]="center" [attr.cy]="center" [attr.r]="r" fill="none" stroke="#fff" stroke-opacity="0.04" stroke-dasharray="2 5" />
    }

    <g fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="0.8" stroke-linecap="round">
      @for (seg of segments(); track seg.id) {
        <path class="line" pathLength="1" [attr.d]="seg.d" [style.animation-delay.ms]="seg.delay" />
      }
    </g>

    @for (star of brightStars(); track star.name) {
      <circle
        class="halo"
        [attr.cx]="star.x"
        [attr.cy]="star.y"
        [attr.r]="star.r * 4"
        fill="url(#halo)"
        opacity="0.35"
        [style.animation-delay.ms]="star.delay"
      />
    }
    @for (star of stars(); track star.name) {
      <circle
        class="star"
        [attr.cx]="star.x"
        [attr.cy]="star.y"
        [attr.r]="star.r"
        [attr.fill]="star.color ?? '#fff'"
        [attr.fill-opacity]="star.opacity"
        [style.animation-delay.ms]="star.delay"
      >
        <title>{{ star.name }}</title>
      </circle>
    }

    <circle [attr.cx]="center" [attr.cy]="center" [attr.r]="radius" fill="none" stroke="#fff" stroke-opacity="0.16" />

    @for (c of cardinals; track c.label) {
      <text
        [attr.x]="c.x"
        [attr.y]="c.y"
        fill="#ebe7df"
        fill-opacity="0.45"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="12"
        letter-spacing="1.5"
        text-anchor="middle"
        dominant-baseline="central"
      >
        {{ c.label }}
      </text>
    }

    <g class="moon">
      <g [attr.transform]="'translate(' + moonGeom.x + ' ' + moonGeom.y + ')'">
        <circle [attr.r]="moonGeom.r * 2.2" fill="url(#moon-glow)" />
        <circle [attr.r]="moonGeom.r" fill="#1b2235" />
        <path [attr.d]="moon().litPath" fill="url(#moon-lit)" [attr.transform]="moon().mirror ? 'scale(-1 1)' : null" />
        <circle [attr.r]="moonGeom.r" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="0.6" />
      </g>
      <text
        [attr.x]="moonGeom.x + moonGeom.r"
        [attr.y]="moonGeom.y + moonGeom.r + 20"
        fill="#ebe7df"
        fill-opacity="0.8"
        font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif"
        font-style="italic"
        font-size="13"
        text-anchor="end"
      >
        {{ moon().name }}
      </text>
      <text
        [attr.x]="moonGeom.x + moonGeom.r"
        [attr.y]="moonGeom.y + moonGeom.r + 35"
        fill="#ebe7df"
        fill-opacity="0.45"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="8.5"
        letter-spacing="1.2"
        text-anchor="end"
      >
        {{ moon().percent }}% ILLUMINATED
      </text>
    </g>
  </svg>

  <figcaption>
    <!-- Date and time are kept unbroken so the sentence wraps between phrases. -->
    <p class="caption">
      The sky over {{ caption().place }} <span class="phrase">on {{ caption().date }}</span>&ngsp;<span class="phrase"
        >at {{ caption().time }}.</span
      >
    </p>
    @if (coords(); as coords) {
      <p class="coords">{{ coords }}</p>
    }
  </figcaption>
</figure>
