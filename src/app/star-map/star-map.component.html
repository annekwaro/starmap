<!--
  Colours inside the SVG are presentation attributes, not CSS: html2canvas serialises
  the SVG into an image, which drops stylesheet rules. CSS here only adds animation.
-->
<figure class="poster" #poster>
  <svg
    class="map"
    viewBox="-40 -40 680 680"
    role="img"
    [attr.aria-label]="caption().text + ' ' + moon().name + '.'"
    (click)="select.emit(null)"
  >
    <defs>
      <radialGradient id="dome" cx="50%" cy="50%" r="50%">
        <stop offset="0%" [attr.stop-color]="dome()[0]" />
        <stop offset="70%" [attr.stop-color]="dome()[1]" />
        <stop offset="100%" [attr.stop-color]="dome()[2]" />
      </radialGradient>
      <radialGradient id="halo">
        <stop offset="0%" stop-color="#fff" stop-opacity="0.55" />
        <stop offset="100%" stop-color="#fff" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="sun-glow">
        <stop offset="0%" stop-color="#ffd27a" stop-opacity="0.7" />
        <stop offset="100%" stop-color="#ffb347" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="moon-lit" cx="40%" cy="35%" r="75%">
        <stop offset="0%" stop-color="#fbf7ec" />
        <stop offset="100%" stop-color="#d8cfb8" />
      </radialGradient>
      <radialGradient id="moon-glow">
        <stop offset="40%" stop-color="#f3ecd8" stop-opacity="0.18" />
        <stop offset="100%" stop-color="#f3ecd8" stop-opacity="0" />
      </radialGradient>
    </defs>

    <circle [attr.cx]="center" [attr.cy]="center" [attr.r]="radius" fill="url(#dome)" />
    @for (r of rings; track r) {
      <circle [attr.cx]="center" [attr.cy]="center" [attr.r]="r" fill="none" stroke="#fff" stroke-opacity="0.04" stroke-dasharray="2 5" />
    }

    @if (showLines()) {
      <g fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="0.8" stroke-linecap="round">
        @for (seg of segments(); track seg.id) {
          <path class="line" pathLength="1" [attr.d]="seg.d" [style.animation-delay.ms]="seg.delay" />
        }
      </g>
    }

    @if (showNames()) {
      <g [attr.font-family]="sansFont" text-anchor="middle" paint-order="stroke" stroke="#05070d" stroke-width="3">
        @for (label of labels(); track label.id) {
          <text [attr.x]="label.x" [attr.y]="label.y" font-size="8" letter-spacing="1.6" fill="#ebe7df" fill-opacity="0.38">
            {{ label.text }}
          </text>
        }
      </g>
    }

    @for (star of brightStars(); track star.name) {
      <circle
        class="halo"
        [attr.cx]="star.x"
        [attr.cy]="star.y"
        [attr.r]="star.r * 4"
        fill="url(#halo)"
        [attr.opacity]="0.35 * star.opacity"
        [style.animation-delay.ms]="star.delay"
      />
    }
    @for (star of stars(); track star.name) {
      <circle
        class="star"
        [attr.cx]="star.x"
        [attr.cy]="star.y"
        [attr.r]="star.r"
        [attr.fill]="star.color ?? '#fff'"
        [attr.fill-opacity]="star.opacity"
        [style.animation-delay.ms]="star.delay"
      />
    }

    @if (showNames()) {
      <g [attr.font-family]="sansFont" font-size="8.5" fill="#ebe7df" fill-opacity="0.6">
        @for (star of namedStars(); track star.name) {
          <text [attr.x]="star.x + star.r + 4" [attr.y]="star.y - star.r - 2">{{ star.name }}</text>
        }
      </g>
    }

    <!-- Sun, Moon and planets at their real positions -->
    @for (body of visibleBodies(); track body.key) {
      <g class="body" [attr.transform]="'translate(' + body.x + ' ' + body.y + ')'">
        @switch (body.key) {
          @case ('sun') {
            <circle r="24" fill="url(#sun-glow)" />
            <circle r="7" [attr.fill]="body.color" />
          }
          @case ('moon') {
            <circle r="16" fill="url(#moon-glow)" />
            <circle r="6" fill="#1b2235" />
            <path [attr.d]="skyMoonLitPath()" fill="#f3ecd8" [attr.transform]="moon().mirror ? 'scale(-1 1)' : null" />
          }
          @default {
            <circle r="12" fill="url(#halo)" opacity="0.4" />
            <circle [attr.r]="body.key === 'venus' || body.key === 'jupiter' ? 3.6 : 2.9" [attr.fill]="body.color" />
          }
        }
        <text
          [attr.x]="body.key === 'sun' ? 12 : 9"
          y="3"
          [attr.font-family]="monoFont"
          font-size="7.5"
          letter-spacing="1"
          [attr.fill]="body.color"
          fill-opacity="0.85"
        >
          {{ body.name.toUpperCase() }}
        </text>
      </g>
    }

    <circle [attr.cx]="center" [attr.cy]="center" [attr.r]="radius" fill="none" stroke="#fff" stroke-opacity="0.16" />

    @for (c of cardinals; track c.label) {
      <text
        [attr.x]="c.x"
        [attr.y]="c.y"
        fill="#ebe7df"
        fill-opacity="0.45"
        [attr.font-family]="sansFont"
        font-size="12"
        letter-spacing="1.5"
        text-anchor="middle"
        dominant-baseline="central"
      >
        {{ c.label }}
      </text>
    }

    @if (selectedPoint(); as p) {
      <circle class="selection" [attr.cx]="p.x" [attr.cy]="p.y" r="10" fill="none" stroke="#f2c46d" stroke-width="1.2" />
    }

    <!-- Generous invisible tap targets on top of everything -->
    <g class="hits">
      @for (star of stars(); track star.name) {
        <circle [attr.cx]="star.x" [attr.cy]="star.y" r="9" fill="transparent" (click)="pick($event, star.name)">
          <title>{{ star.name }}</title>
        </circle>
      }
      @for (body of visibleBodies(); track body.key) {
        <circle [attr.cx]="body.x" [attr.cy]="body.y" r="12" fill="transparent" (click)="pick($event, body.name)">
          <title>{{ body.name }}</title>
        </circle>
      }
    </g>

    <g class="moon">
      <g [attr.transform]="'translate(' + cornerMoon.x + ' ' + cornerMoon.y + ')'">
        <circle [attr.r]="cornerMoon.r * 2.2" fill="url(#moon-glow)" />
        <circle [attr.r]="cornerMoon.r" fill="#1b2235" />
        <path [attr.d]="cornerLitPath()" fill="url(#moon-lit)" [attr.transform]="moon().mirror ? 'scale(-1 1)' : null" />
        <circle [attr.r]="cornerMoon.r" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="0.6" />
      </g>
      <text
        [attr.x]="cornerMoon.x + cornerMoon.r"
        [attr.y]="cornerMoon.y + cornerMoon.r + 20"
        fill="#ebe7df"
        fill-opacity="0.8"
        [attr.font-family]="serifFont"
        font-style="italic"
        font-size="13"
        text-anchor="end"
      >
        {{ moon().name }}
      </text>
      <text
        [attr.x]="cornerMoon.x + cornerMoon.r"
        [attr.y]="cornerMoon.y + cornerMoon.r + 35"
        fill="#ebe7df"
        fill-opacity="0.45"
        [attr.font-family]="sansFont"
        font-size="8.5"
        letter-spacing="1.2"
        text-anchor="end"
      >
        {{ moon().percent }}% ILLUMINATED
      </text>
    </g>
  </svg>

  <figcaption>
    <!-- Date and time are kept unbroken so the sentence wraps between phrases. -->
    <p class="caption">
      The sky over {{ caption().place }} <span class="phrase">on {{ caption().date }}</span>&ngsp;<span class="phrase"
        >at {{ caption().time }}.</span
      >
    </p>
    @if (coords(); as coords) {
      <p class="coords">{{ coords }}</p>
    }
  </figcaption>
</figure>
