<main class="stage">
  <div class="orbits" aria-hidden="true">
    <span class="orbit o1"><i></i></span>
    <span class="orbit o2"><i></i></span>
    <span class="orbit o3"><i></i></span>
  </div>

  <form class="card panel" (submit)="reveal($event)">
    <p class="eyebrow">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
        <path d="M8 1.5l1.6 4.9 4.9 1.6-4.9 1.6L8 14.5l-1.6-4.9L1.5 8l4.9-1.6z" fill="currentColor" />
      </svg>
      Star map generator
    </p>
    <h1 class="headline">
      @for (word of headline; track $index) {
        <span class="word" [class.dim]="word.dim" [style.--i]="$index">{{ word.text }}</span>&ngsp;
      }
    </h1>
    <p class="lede">Choose a moment and a place. We’ll show you the stars, planets and Moon that were overhead.</p>

    <div class="row">
      <div class="field">
        <label for="date">Date</label>
        <input id="date" type="date" required #dateInput [value]="selectedDate()" (input)="selectedDate.set(dateInput.value)" />
      </div>
      <div class="field">
        <label for="time">Time</label>
        <input id="time" type="time" required #timeInput [value]="selectedTime()" (input)="selectedTime.set(timeInput.value)" />
      </div>
    </div>

    <div class="field">
      <label for="location">Location</label>
      <div class="location">
        <select id="location" #locationSelect aria-describedby="location-hint" (change)="onLocationChange(locationSelect.value)">
          <option [value]="myLocation.value" [selected]="locationChoice() === myLocation.value">{{ myLocationLabel() }}</option>
          @for (city of cities; track city.name) {
            <option [value]="city.name" [selected]="locationChoice() === city.name">{{ city.name }}</option>
          }
        </select>
        <button
          type="button"
          class="icon-btn locate"
          aria-label="Use my location"
          title="Use my location"
          [disabled]="geoStatus() === 'locating'"
          (click)="useMyLocation()"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <p id="location-hint" class="hint" [class.is-error]="geoStatus() === 'error'" aria-live="polite">{{ locationHint() }}</p>
    </div>

    <button type="submit" class="reveal" [disabled]="!canReveal()">
      <span class="reveal-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z" fill="currentColor" />
        </svg>
      </span>
      <span class="reveal-label">Reveal the sky</span>
      <span class="chevrons" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
  </form>
</main>
