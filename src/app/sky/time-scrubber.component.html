<div class="head">
  <div>
    <p class="label">Scrub the night</p>
    <p class="time">
      {{ current() }} <span class="day">{{ currentDay() }}</span>
    </p>
  </div>
  @if (offset() !== 0) {
    <button type="button" class="reset" (click)="offset.set(0)">Back to {{ baseLabel() }}</button>
  } @else {
    <span class="relative">{{ relative() }}</span>
  }
</div>

<div class="events" aria-hidden="true">
  @for (e of sunEvents(); track e.x) {
    <span class="event" [style.left.%]="e.x" [class.is-start]="e.x < 15" [class.is-end]="e.x > 85">
      <svg viewBox="0 0 12 12" width="10" height="10">
        <path
          [attr.d]="e.rising ? 'M6 10V3M3 6l3-3 3 3' : 'M6 2v7M3 6l3 3 3-3'"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      {{ e.label }}
    </span>
  }
</div>

<div class="ruler" [style.background]="daylightGradient()">
  <svg class="ticks" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">
    @for (t of ticks(); track t.x) {
      <line
        [attr.x1]="t.x"
        [attr.x2]="t.x"
        [attr.y1]="t.major ? 8 : 16"
        [attr.y2]="t.major ? 32 : 24"
        stroke="#fff"
        [attr.stroke-opacity]="t.major ? 0.5 : 0.22"
        vector-effect="non-scaling-stroke"
      />
    }
    <line x1="50" x2="50" y1="0" y2="40" stroke="#fff" stroke-opacity="0.18" stroke-dasharray="2 3" vector-effect="non-scaling-stroke" />
  </svg>
  <input
    type="range"
    step="5"
    #range
    [min]="-span"
    [max]="span"
    [value]="offset()"
    (input)="onInput(range.value)"
    aria-label="Time of night"
    [attr.aria-valuetext]="current() + ', ' + relative()"
  />
</div>

<div class="hours" aria-hidden="true">
  @for (t of ticks(); track t.x) {
    @if (t.label) {
      <span [style.left.%]="t.x">{{ t.label }}</span>
    }
  }
</div>
